[project]
name = "astra-agent-reliability-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.scripts]
astra-runtime = "astra.cli:main"
astra-phase3 = "astra.phase3.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
